version: 2

project_name: innodump

before:
  hooks:
    - go mod tidy

builds:
  - id: innodump
    binary: innodump
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: innodump
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^gofmt"
      - "^wip:"

release:
  github:
    owner: PrzemekMalkowski
    name: innodump
  header: |
    See README.md for full usage, scope, and validation details.
